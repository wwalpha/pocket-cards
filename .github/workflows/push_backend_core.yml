name: PUSH_B) core CI

on:
  push:
    branches-ignore:
      - releases/**
    paths:
      - 'backend/nodejs/core/**'
      - 'backend/nodejs/*'
      - 'backend/nodejs/typings/**'
      - 'package.json'
      - 'yarn.lock'
      - '.nvmrc'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  Backend:
    uses: ./.github/workflows/reuse_build_ci.yml
    with:
      working-directory: backend/nodejs/core
