name: RELEASE_B) Production Build

on:
  release:
    types:
      - prereleased
      - edited
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Terraform
  Terraform_Setup:
    uses: ./.github/workflows/reuse_terraform.yml
    with:
      working-directory: infrastructure/terraform/setup
      environment: prod
    secrets:
      TF_VARS: ${{ secrets.TERRAFORM_VARS }}

  Terraform_Service:
    needs:
      - Terraform_Setup
      - Lambda_AuthorizerV1
      - Lambda_AuthorizerV2
      - Lambda_Status
      - Lambda_Start
      - Lambda_Stop
      - Lambda_WSS_Connect
      - Lambda_WSS_Disconnect
      - Lambda_WSS_Commands
      - Lambda_WSS_Relay
    uses: ./.github/workflows/reuse_terraform.yml
    with:
      working-directory: infrastructure/terraform/services
      environment: prod
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_VARS: ${{ secrets.TERRAFORM_VARS }}

  # Backend
  Backend:
    uses: ./.github/workflows/reuse_ecs_build.yml
    with:
      working-directory: backend/nodejs/core
      environment: prod
      run-tests: false
      ECS_SERVICE_NAME: backend
      ECR_REPOSITORY: pkc/backend

  # Batch
  Batch:
    uses: ./.github/workflows/reuse_ecs_build.yml
    with:
      working-directory: backend/nodejs/batch
      environment: prod
      run-tests: false
      ECS_SERVICE_NAME: batch
      ECR_REPOSITORY: pkc/batch

  # Auth Manager
  Auth_Manager:
    uses: ./.github/workflows/reuse_ecs_build.yml
    with:
      working-directory: backend/nodejs/auth_manager
      environment: prod
      ECS_SERVICE_NAME: auth_manager
      ECR_REPOSITORY: pkc/auth

  # Users Manager
  Users_Manager:
    uses: ./.github/workflows/reuse_ecs_build.yml
    with:
      working-directory: backend/nodejs/user_manager
      environment: prod
      ECS_SERVICE_NAME: user_manager
      ECR_REPOSITORY: pkc/users

  # Lambda Container Images (the base image is the same commit's ECS image)
  Lambda_Backend_Image:
    needs:
      - Terraform_Setup
      - Backend
    uses: ./.github/workflows/reuse_lambda_image_build.yml
    with:
      environment: prod
      BASE_ECR_REPOSITORY: pkc/backend
      LAMBDA_ECR_REPOSITORY: pkc/backend-lambda
      LAMBDA_SERVICE_NAME: backend

  Lambda_Auth_Image:
    needs:
      - Terraform_Setup
      - Auth_Manager
    uses: ./.github/workflows/reuse_lambda_image_build.yml
    with:
      environment: prod
      BASE_ECR_REPOSITORY: pkc/auth
      LAMBDA_ECR_REPOSITORY: pkc/auth-lambda
      LAMBDA_SERVICE_NAME: auth

  Lambda_Users_Image:
    needs:
      - Terraform_Setup
      - Users_Manager
    uses: ./.github/workflows/reuse_lambda_image_build.yml
    with:
      environment: prod
      BASE_ECR_REPOSITORY: pkc/users
      LAMBDA_ECR_REPOSITORY: pkc/users-lambda
      LAMBDA_SERVICE_NAME: users

  # Lambda
  Lambda_AuthorizerV1:
    needs: Terraform_Setup
    uses: ./.github/workflows/reuse_lambda.yml
    with:
      working-directory: backend/nodejs/lambda/authorizer_v1
      environment: prod
      function-name: authorizer_v1

  Lambda_AuthorizerV2:
    needs: Terraform_Setup
    uses: ./.github/workflows/reuse_lambda.yml
    with:
      working-directory: backend/nodejs/lambda/authorizer_v2
      environment: prod
      function-name: authorizer_v2

  Lambda_Status:
    needs: Terraform_Setup
    uses: ./.github/workflows/reuse_lambda.yml
    with:
      working-directory: backend/nodejs/lambda/status
      environment: prod
      function-name: status

  Lambda_Start:
    needs: Terraform_Setup
    uses: ./.github/workflows/reuse_lambda.yml
    with:
      environment: prod
      working-directory: backend/nodejs/lambda/start
      function-name: start

  Lambda_Stop:
    needs: Terraform_Setup
    uses: ./.github/workflows/reuse_lambda.yml
    with:
      working-directory: backend/nodejs/lambda/stop
      environment: prod
      function-name: stop

  Lambda_WSS_Connect:
    needs: Terraform_Setup
    uses: ./.github/workflows/reuse_lambda.yml
    with:
      working-directory: backend/nodejs/lambda/wss_connect
      environment: prod
      function-name: wss_connect

  Lambda_WSS_Disconnect:
    needs: Terraform_Setup
    uses: ./.github/workflows/reuse_lambda.yml
    with:
      working-directory: backend/nodejs/lambda/wss_disconnect
      environment: prod
      function-name: wss_disconnect

  Lambda_WSS_Commands:
    needs: Terraform_Setup
    uses: ./.github/workflows/reuse_lambda.yml
    with:
      working-directory: backend/nodejs/lambda/wss_commands
      environment: prod
      function-name: wss_commands

  Lambda_WSS_Relay:
    needs: Terraform_Setup
    uses: ./.github/workflows/reuse_lambda.yml
    with:
      working-directory: backend/nodejs/lambda/wss_relay
      environment: prod
      function-name: wss_relay

  # Frontend Admin
  Frontend_Admin:
    needs: Terraform_Service
    uses: ./.github/workflows/reuse_react.yml
    with:
      environment: prod
      working-directory: frontend/react
      module: admin
      deploy: false
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

  # Frontend Users
  Frontend_Users:
    needs: Terraform_Service
    uses: ./.github/workflows/reuse_react.yml
    with:
      environment: prod
      working-directory: frontend/react
      module: users
      deploy: false
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
