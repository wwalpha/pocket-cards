name: PUSH_F) admin CI

on:
  push:
    branches-ignore:
      - releases/**
    paths:
      - 'frontend/react/**'
      - '!frontend/react/users/**'
      - 'package.json'
      - 'yarn.lock'
      - '.nvmrc'
      - '.github/workflows/**'

permissions:
  contents: read
  id-token: write

jobs:
  Build:
    uses: ./.github/workflows/reuse_react.yml
    with:
      environment: dev
      working-directory: frontend/react
      module: admin
      deploy: false
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
