name: COM) Build CI

on:
  workflow_call:
    # inputs
    inputs:
      environment:
        required: false
        type: string
        default: dev
      working-directory:
        required: true
        type: string

permissions:
  contents: read

jobs:
  BUILD:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      # source checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Install and Build
      - name: Build
        run: |
          yarn install
          yarn build

      # Unit Test
      # - name: Unit Test
      #   run: |
      #     docker compose up -d --build
      #     sleep 10
      #     yarn test
      #     docker compose down

      # docker build
      - name: Docker Image Build
        run: |
          docker build .
