name: COM) Build CI

on:
  workflow_call:
    # inputs
    inputs:
      environment:
        required: false
        type: string
        default: dev
      working-directory:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  BUILD:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      # source checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      # v4 does not support allowed-account-ids; enforce the account before AWS writes.
      - name: Verify AWS account
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT_ID"

      # Install and Build
      - name: Build
        run: |
          yarn install
          yarn build

      # Unit Test
      # - name: Unit Test
      #   run: |
      #     docker compose up -d --build
      #     sleep 10
      #     yarn test
      #     docker compose down

      # docker build
      - name: Docker Image Build
        run: |
          docker build .
