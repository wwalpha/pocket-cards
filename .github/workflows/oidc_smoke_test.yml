name: AWS OIDC Smoke Test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to verify
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify caller identity
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          identity=$(aws sts get-caller-identity --output json)
          echo "$identity"
          jq -e --arg account "$EXPECTED_ACCOUNT_ID" '
            .Account == $account and
            (.Arn | startswith("arn:aws:sts::" + $account + ":assumed-role/GitHubActionsDeployRole/"))
          ' <<< "$identity"
