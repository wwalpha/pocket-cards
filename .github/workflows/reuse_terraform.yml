name: COM) Terraform Build

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      vpc_id:
        required: false
        type: string
      vpc_subnets:
        required: false
        type: string
      apply:
        required: false
        type: boolean
        default: true

    secrets:
      TF_API_TOKEN:
        required: false
      TF_VARS:
        required: false
      TERRAFORM_VARS:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  Apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      TF_WORKSPACE: ${{ inputs.environment }}
      TF_VARS: ${{ secrets.TERRAFORM_VARS || secrets.TF_VARS }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      # source checkout
      - name: Checkout
        uses: actions/checkout@v4

      # AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      # v4 does not support allowed-account-ids; enforce the account before AWS writes.
      - name: Verify AWS account
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT_ID"

      # Install the latest version of Terraform CLI 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.5

      # Terraform execution
      - name: Initialize Terraform
        run: |
          echo $TF_VARS > local.auto.tfvars.json
          terraform init

      - name: Validate Terraform
        if: ${{ !inputs.apply }}
        run: terraform validate

      - name: Plan Terraform
        run: terraform plan -out=terraform -compact-warnings

      - name: Apply Terraform
        if: inputs.apply
        run: terraform apply "terraform"
