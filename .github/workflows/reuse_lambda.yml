name: COM) Lambda Build

on:
  workflow_call:
    inputs:
      function-name:
        required: true
        type: string
      environment:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      upload:
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  LAMBDA_BUILD:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.LAMBDA_OUTPUTS_BUCKET }}
      FUNCTION_NAME: ${{ inputs.function-name }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      # source checkout
      - name: Checkout
        uses: actions/checkout@v7

      # Setup Node.js
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # AWS Credentials
      - name: Validate AWS environment variables
        if: inputs.upload
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          for variable in AWS_ROLE_ARN AWS_REGION AWS_ACCOUNT_ID; do
            if [ -z "${!variable}" ]; then
              echo "::error::GitHub Environment variable $variable is not configured"
              exit 1
            fi
          done

      - name: Configure AWS credentials
        if: inputs.upload
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Enforce the account before AWS writes.
      - name: Verify AWS account
        if: inputs.upload
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT_ID"

      # Install and Build
      - name: Build
        run: |
          yarn install
          yarn build

      - name: Upload Lambda package
        if: inputs.upload
        run: aws s3 cp dist.zip s3://$S3_BUCKET/lambda_modules/$FUNCTION_NAME.zip
